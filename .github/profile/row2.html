<!doctype html><meta charset=utf-8>
<!-- Tech Stack + katkı takvimi satırının şablonu. update-calendar.mjs doldurur ve fotoğrafını çeker. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel=stylesheet>
<style>
*{box-sizing:border-box;margin:0}
html{background:transparent}
body{width:1000px;zoom:3;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased;color:var(--fg)}
.dark{--fg:#ecebf3;--mut:#a3a1b4;--c1:#1b1a24;--c2:#141319;--bd:#2b2a37;--ib:#221e38;--ibd:#3d3566;--acc:#a78bfa;--chip:#1d1c26;--chipbd:#34333f;--chipfg:#dcdae8;--hw:#ecebf3;--hwfg:#141419;--sh:0 10px 30px -18px #000}
.light{--fg:#1b1a24;--mut:#696679;--c1:#ffffff;--c2:#fbfaff;--bd:#e3e0ee;--ib:#f2efff;--ibd:#ddd5fb;--acc:#7c5cf0;--chip:#f7f6fb;--chipbd:#e1dfea;--chipfg:#2c2a38;--hw:#1b1a24;--hwfg:#fff;--sh:0 10px 30px -20px rgba(60,40,120,.35)}
.blk{margin-bottom:24px;position:relative}
.card{background:linear-gradient(180deg,var(--c1),var(--c2));border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh)}
.mut{color:var(--mut)}
/* hero */
#hero{height:270px;display:flex;align-items:center;padding-left:28px;border-radius:16px;overflow:hidden;border:1px solid #2b2a37;background:url(hero.webp) center 58%/cover}
#hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,5,20,.62),transparent 55%)}
.quote{position:absolute;left:46px;top:46px;padding-left:16px;border-left:3px solid #8b6cf6;font-size:18px;color:#f3f0ff;height:46px;display:flex;align-items:center;z-index:1}
#cal{width:474px;padding:20px 22px;height:196px}
.mo,.cg{display:grid;grid-template-columns:repeat(53,6.4px);column-gap:1.6px}
.mo{margin-top:14px;font-size:10px;color:var(--mut);height:14px}.mo span{white-space:nowrap}
.cg{grid-template-rows:repeat(7,6.4px);row-gap:1.6px;margin-top:4px}
.cg i{border-radius:1.6px;background:var(--q0)}
.cg .l1{background:var(--q1)}.cg .l2{background:var(--q2)}.cg .l3{background:var(--q3)}.cg .l4{background:var(--q4)}.cg .f{opacity:.45}
.cf{margin-top:14px;font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:7px}.cf b{color:var(--fg);font-weight:700}.cf svg{color:var(--acc)}
.dark{--q0:#25233a;--q1:#3f3480;--q2:#5a45b8;--q3:#7c5cf0;--q4:#b39dff}
.light{--q0:#ecebf3;--q1:#d6ccfb;--q2:#ab97f5;--q3:#7c5cf0;--q4:#4f33c4}
/* contact */
#contact{display:flex;align-items:center;height:84px;padding:0 22px}
.ico{width:48px;height:48px;border-radius:12px;background:var(--ib);border:1px solid var(--ibd);display:grid;place-items:center;color:var(--acc);font-weight:700;font-size:19px}
.ctext{margin-left:20px;width:330px}
.ctext h3{font-size:18px;font-weight:600}
.ctext p{font-size:13.5px;margin-top:5px}
.soc{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border:1px solid var(--chipbd);border-radius:999px;background:var(--chip);font-size:13.5px;color:var(--chipfg);margin-right:10px}
.soc img{width:16px;height:16px;opacity:.85}
.dark .soc img{filter:invert(1)}
.btn{margin-left:auto;height:38px;padding:0 20px;border-radius:999px;background:#7c5cf0;color:#fff;font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px -6px #7c5cf0}
/* row 2 */
#row2{display:flex;gap:14px}
.ptitle{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600}
.ptitle svg{color:var(--acc)}
#stack{flex:1;padding:22px 24px;height:196px}
.icons{display:flex;justify-content:space-around;margin-top:38px}
.icons div{text-align:center;font-size:12.5px;color:var(--chipfg)}
.icons img{width:40px;height:40px;display:block;margin:0 auto 11px}
#about{position:relative;z-index:1;width:360px;padding:20px 22px;border-radius:16px;background:rgba(14,11,30,.58);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#f3f0ff;box-shadow:0 18px 40px -20px #000;--mut:#c9c3e6;--chipfg:#ebe7ff;--acc:#b9a3ff}
#about p{font-size:13px;line-height:1.5;margin-top:11px}
.tags{margin-top:12px;font-size:12.5px;color:var(--chipfg);display:grid;gap:7px}
.tags span{display:flex;align-items:center;gap:9px}
.tags svg{color:var(--mut)}
/* projects */
.big{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;padding:2px 4px 14px}
.sec{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 12px}
.sec .l{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600}
.badge{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
.hw{background:var(--hw);color:var(--hwfg)}
.ai{color:var(--acc);border:1px dashed var(--acc);background:repeating-linear-gradient(45deg,transparent 0 5px,rgba(139,108,246,.14) 5px 10px)}
.sec .r{font-size:12.5px}
.grid{display:flex;gap:14px}
.pc{flex:0 0 calc(50% - 7px);height:104px;padding:18px;display:flex;gap:16px;align-items:center}
.pi{width:54px;height:54px;border-radius:13px;background:var(--ib);border:1px solid var(--ibd);display:grid;place-items:center;flex:none;overflow:hidden}
.pi img{width:40px;height:40px;object-fit:contain}
.pc h4,.cc h4{font-size:15px;font-weight:600}
.pc p{font-size:12.5px;margin-top:4px}.pc .badge{font-size:9.5px;padding:3px 7px;margin-left:8px;vertical-align:2px}
.st{margin-top:8px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#f5b301;background:rgba(245,179,1,.12);border:1px solid rgba(245,179,1,.35);padding:3px 10px 3px 7px;border-radius:999px}.st svg{filter:drop-shadow(0 0 4px rgba(245,179,1,.7))}.light .st{color:#b07d00;background:#fff6d6;border-color:#f3d77a}
.cc{flex:0 0 calc(33.333% - 9.4px);height:78px;padding:14px 16px;display:flex;gap:14px;align-items:center}
.cc .pi{width:48px;height:48px;border-radius:12px}
.cc .pi img{width:36px;height:36px}
.cc .pi img.full{width:48px;height:48px;object-fit:cover}
</style>
<body>
<div class=blk id=row2>
 <div class=card id=stack>
  <div class=ptitle><svg width=18 height=18 viewBox="0 0 24 24" fill="currentColor"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>Tech Stack</div>
  <div class=icons>
   <div><img src="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.16.0/icons/csharp/csharp-original.svg">C#</div>
   <div><img src="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.16.0/icons/azuresqldatabase/azuresqldatabase-original.svg">SQL</div>
   <div><img src="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.16.0/icons/javascript/javascript-original.svg">JavaScript</div>
   <div><img src="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.16.0/icons/html5/html5-original.svg">HTML5</div>
   <div><img src="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.16.0/icons/css3/css3-original.svg">CSS3</div>
  </div>
 </div>

 <div class=card id=cal>
  <div class=ptitle><svg width=18 height=18 viewBox="0 0 24 24" fill="currentColor"><path d="M7 2v2H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2h-2V2h-2v2H9V2zM5 9h14v11H5z"/></svg>Contributions</div>
  <div class=mo><!--MONTHS--></div>
  <div class=cg><!--CELLS--></div>
  <div class=cf><svg width=15 height=15 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg><b><!--TOTAL--></b> contributions in <!--YEAR--></div>
 </div>
</div>
